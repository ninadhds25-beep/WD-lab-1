<!DOCTYPE html>
<html>
<head>
<title>Road Safety Seminar Session Form</title>
</head>

<body>

<h2>Road Safety Seminar Registration</h2>

<form>

<fieldset>
<legend>Participant Information</legend>

Name: <input type="text" name="name"><br><br>

Email: <input type="email" name="email"><br><br>

Phone: <input type="text" name="phone"><br><br>

Gender:
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<br><br>

</fieldset>

<fieldset>
<legend>Seminar Details</legend>

Select Session:
<select name="session">
<option>Morning Session</option>
<option>Afternoon Session</option>
<option>Evening Session</option>
</select>

<br><br>



</fieldset>

<br>

<input type="submit" value="Register">
<input type="reset" value="Clear">

</form>

</body>
</html>
